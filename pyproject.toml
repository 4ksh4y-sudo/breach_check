[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "breachcheck"
version = "1.1.0"
description = "Check email/password exposure in known data breaches. Never retrieves or displays breached passwords."
readme = "README.md"
requires-python = ">=3.7"
license = { text = "MIT" }
authors = [{ name = "Your Name", email = "you@example.com" }]
keywords = ["security", "breach", "hibp", "pwned", "password", "privacy"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[project.scripts]
breachcheck = "breachcheck:main"

[tool.setuptools]
py-modules = ["breachcheck"]
